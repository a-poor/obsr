[package]
name = "obsr"
version = "0.1.0"
edition = "2024"
description = "An async obs-websocket 5.x client, built on Tokio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/a-poor/obsr"
keywords = ["obs", "obs-websocket", "websocket", "tokio", "async"]
categories = ["api-bindings", "asynchronous", "multimedia"]
exclude = [".cargo", ".gitattributes", ".github"]

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }

[workspace]
members = ["xtask"]
